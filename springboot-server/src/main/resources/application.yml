server:
  port: ${VIDOC_SERVER_PORT:8080}

spring:
  application:
    name: vidoc-server
  profiles:
    active: local
  datasource:
    url: ${VIDOC_DB_URL:jdbc:mysql://localhost:3306/vidoc?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${VIDOC_DB_USERNAME:root}
    password: ${VIDOC_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null

# Sa-Token
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-cookie: false
  is-read-body: false
  timeout: ${VIDOC_TOKEN_TIMEOUT:604800}
  active-timeout: -1
  token-style: uuid
  is-concurrent: true
  is-share: false

vidoc:
  summary:
    concurrency: ${VIDOC_SUMMARY_CONCURRENCY:8}
    max-duration-seconds: ${VIDOC_SUMMARY_MAX_DURATION_SECONDS:10800}
  # 积分
  points:
    # 注册时一次性赠送的永久积分
    signup-grant: ${VIDOC_POINTS_SIGNUP_GRANT:100}
    # 用户最多保留的流水条数
    ledger-keep: ${VIDOC_POINTS_LEDGER_KEEP:50}
  ytdlp:
    path: ${VIDOC_YTDLP_PATH:yt-dlp}
    timeout-seconds: ${VIDOC_YTDLP_TIMEOUT_SECONDS:120}
    max-output-bytes: ${VIDOC_YTDLP_MAX_OUTPUT_BYTES:10485760}
    work-dir: ${VIDOC_YTDLP_WORK_DIR:${java.io.tmpdir}}
    max-concurrency: ${VIDOC_YTDLP_MAX_CONCURRENCY:16}

  # 全站一条 LLM 线路
  llm:
    max-input-chars: ${VIDOC_LLM_MAX_INPUT_CHARS:80000}
    provider: ${VIDOC_LLM_PROVIDER:openai-compatible}
    api-key: ${VIDOC_LLM_API_KEY:}
    base-url: ${VIDOC_LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    model: ${VIDOC_LLM_MODEL:glm-4-flashx-250414}
    max-output-tokens: ${VIDOC_LLM_MAX_OUTPUT_TOKENS:16384}
    disable-thinking: ${VIDOC_LLM_DISABLE_THINKING:false}
    reasoning-effort: ${VIDOC_LLM_REASONING_EFFORT:}

  alipay:
    enabled: ${VIDOC_ALIPAY_ENABLED:true}
    sandbox: ${VIDOC_ALIPAY_SANDBOX:false}
    app-id: ${VIDOC_ALIPAY_APP_ID:}
    private-key: ${VIDOC_ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${VIDOC_ALIPAY_PUBLIC_KEY:}
    gateway: ${VIDOC_ALIPAY_GATEWAY:}
    notify-url: ${VIDOC_ALIPAY_NOTIFY_URL:https://api.vidocnote.com/api/payments/alipay/notify}
    return-url: ${VIDOC_ALIPAY_RETURN_URL:https://vidocnote.com/dashboard/billing}
    order-timeout-minutes: ${VIDOC_ALIPAY_ORDER_TIMEOUT_MINUTES:120}
  cors:
    allowed-origins: ${VIDOC_CORS_ALLOWED_ORIGINS:http://localhost:3000}

  turnstile:
    enabled: ${VIDOC_TURNSTILE_ENABLED:false}
    secret-key: ${VIDOC_TURNSTILE_SECRET_KEY:}
    verify-url: ${VIDOC_TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
    expected-hostname: ${VIDOC_TURNSTILE_EXPECTED_HOSTNAME:}
    expected-action: ${VIDOC_TURNSTILE_EXPECTED_ACTION:}

langchain4j:
  open-ai:
    chat-model:
      # 1. 填你在阿里云百炼申请的 API Key（sk-开头）
      api-key: sk-你的百炼API密钥
      # 2. 关键：把接口地址改成百炼的兼容地址
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      # 3. 填你要用的模型名，比如 qwen-plus 或 qwen-turbo
      model-name: qwen-plus
      # 可选：开启请求和响应日志，方便你调试排错
      log-requests: true
      log-responses: true

logging:
  level:
    com.vidoc: info
