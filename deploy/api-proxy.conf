# 部署到 /etc/nginx/snippets/vidoc-api-proxy.conf，供 /api/ 与那几个精确匹配的 API location 共用。
# 抽出来是因为它们除了各自那条 limit_req 之外必须完全一致，复制一份迟早改一处漏一处。
#
# 这里的 security-headers include 不能省：nginx 的 add_header 不向「自带 add_header 的 location」
# 继承，下面只要有一条 Cache-Control，服务器级的安全头在这个 location 就会整片消失。

include /etc/nginx/snippets/vidoc-security-headers.conf;

# 放在这里而不是各个 location：所有 /api 入口都 include 本文件，限流参数只该有一份。
# 上限给 60 是「地板」不是「按用户收紧」——limit_conn 只统计正在处理请求的连接（keep-alive 空闲连接
# 不计入），所以浏览器那几条长连接不占额度；它的作用是让单个 IP 吃不满 worker_connections。
limit_conn vidoc_conn 60;

# API 只收几个字段的 JSON 与支付宝的表单，nginx 默认的 1m 明显偏大
client_max_body_size 64k;

proxy_pass http://127.0.0.1:8080;
proxy_http_version 1.1;
proxy_set_header Host $host;
# 只认最近的对端，不沿用客户端自己带上来的 XFF（否则可以伪造来源 IP 绕过限流）
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;

# 订单、积分、登录态响应不能被 CDN 或浏览器缓存
add_header Cache-Control "no-store" always;
