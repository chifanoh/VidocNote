# Vidoc Note —— 只管 api.vidocnote.com（EdgeOne Pages 托静态页，API 走独立子域直连本机）。
# 域名整体迁回 VPS（撤掉 Pages）时把三个 server_name 都指过来即可，这份配置不用动。
#
# 两条反直觉的地方，改之前先看：
# 1) nginx 的 add_header 不向「自带 add_header 的 location」继承 —— 某个 location 只要写了自己的
#    add_header，服务器级安全头会在那里整片消失。所以缓存全部用 expires 表达（expires 不影响继承），
#    安全头只在服务器级 include 一次；/api 那几个 location 走 vidoc-api-proxy.conf，里面又 include 了一次。
# 2) 静态页是 EdgeOne Pages 发的，HSTS / CSP 要在 nuxt-web/edgeone.json 里另配一份（值与本文件一致）；
#    这里配的只对直连 VPS 的响应生效。

# ---- 限流 ----
# 所有 zone 的 key 都是 $binary_remote_addr。这在当前架构下成立：/api 是 api 子域直连本机、
# 中间没有 CDN，故 $remote_addr 就是真实客户端 IP。将来在 api 前面再套 CDN/WAF，这里必须改成
# 读 trust 过的 X-Forwarded-For，否则全站限流会退化成「一个全局计数器」（一个人刷满、所有人被限）。

# 登录接口的洪泛闸门：单 IP 平均 60 次/分钟、允许 20 次突发。
# 定这么松是故意的 —— 真正防刷的是 Turnstile，这里只挡脚本洪水；国内 CGNAT 下大量用户共用出口 IP，
# 收紧到个位数会误伤正常登录。也别改成挂整个 /api/auth/：/api/auth/me 每次加载页面都会调。
limit_req_zone $binary_remote_addr zone=vidoc_auth:10m rate=60r/m;

# 写操作（POST）的统一闸门，一条覆盖除 notify 外的 5 个 POST：建摘要、建订单、pay、confirm、logout。
# （notify 是精确匹配 location，自带一条 limit_req，不会叠加到这条上。）
# 用 map 是因为它只该限 POST —— 「空 key 的请求不计入」是 limit_req_zone 的明文行为，
# 于是 GET（列表、轮询、/me）自然豁免，不需要给每个端点拆 location。
# burst 只给 5：真实节奏是串行的（一次生成 20s 以上、前端一次只跑一个），放大突发只会让
# 单个 IP 在几十秒内把任务队列刷满，而队列满 = 所有人都收 503。
map $request_method $vidoc_post_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $vidoc_post_key zone=vidoc_post:10m rate=10r/m;

# 匿名通知端点：每次都要跑一遍 RSA 验签，是纯 CPU 成本。正常一次支付只有几条通知，
# 60r/m 远高于真实流量，不会影响支付宝的重投。
limit_req_zone $binary_remote_addr zone=vidoc_notify:10m rate=60r/m;

# 单 IP 并发连接的地板，不按用户收紧：官方文档明确只统计「正在处理请求」的连接，
# keep-alive 的空闲连接不计入，所以浏览器的 6 条长连接不会白白占额度。
# 给 60 是让单个 IP 无法独自吃满 worker_connections（默认 768），同时给 CGNAT 共用出口留足余量。
limit_conn_zone $binary_remote_addr zone=vidoc_conn:10m;

server {
    listen 80 default_server;
    server_name api.vidocnote.com vidocnote.com www.vidocnote.com;

    # 证书：certbot certonly --webroot -w /var/www/vidoc --cert-name vidocnote.com -d api.vidocnote.com
    # 现在只有 api 子域解析到本机（另两个还在 EdgeOne Pages，加进去验签必失败）；将来整体迁回再补 -d。
    # --cert-name 固定成 vidocnote.com，否则证书目录名会跟着第一个 -d 变，下面的 ssl_certificate 会失配。
    # 不要用 --nginx，它会往这份配置里插内容。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vidoc;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 源里是 nginx 1.24，没有 1.25 才加的 "http2 on;"，只能写在 listen 上
    listen 443 ssl http2;

    server_name api.vidocnote.com vidocnote.com www.vidocnote.com;

    ssl_certificate     /etc/letsencrypt/live/vidocnote.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidocnote.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:vidoc_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # 默认是 503，会被前端当成「服务坏了」；429 才是「你太快了」
    limit_req_status 429;
    limit_conn_status 429;

    root /var/www/vidoc;
    index index.html;

    include /etc/nginx/snippets/vidoc-security-headers.conf;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 文件名带内容哈希，改版即换名，可以放心长缓存
    location /_nuxt/ {
        expires 1y;
        try_files $uri =404;
    }

    # 预渲染页面必须每次回源校验，否则发版后用户仍看到旧页
    location ~ \.html$ {
        expires -1;
    }

    location ~* \.(?:ico|png|jpe?g|webp|svg|woff2?)$ {
        expires 30d;
        try_files $uri =404;
    }

    # 登录/注册单独一道（见上方 zone 注释）。它自带 limit_req 故不继承 /api/ 那条，两者互不叠加
    location = /api/auth/login {
        limit_req zone=vidoc_auth burst=20 nodelay;
        include /etc/nginx/snippets/vidoc-api-proxy.conf;
    }

    # 匿名通知端点：每次都要跑一遍 RSA 验签，是纯 CPU 成本。正常一次支付只有几条通知，
    # 不会碰到上限，也不影响支付宝的重投
    location = /api/payments/alipay/notify {
        limit_req zone=vidoc_notify burst=20 nodelay;
        include /etc/nginx/snippets/vidoc-api-proxy.conf;
    }

    location /api/ {
        limit_req zone=vidoc_post burst=5 nodelay;
        include /etc/nginx/snippets/vidoc-api-proxy.conf;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /200.html;
    }
}
