# 部署到 /etc/nginx/snippets/vidoc-security-headers.conf，由 nginx.conf 在 server 级 include。
# CSP 为什么允许 'unsafe-inline'：Nuxt 静态产物把 __NUXT_DATA__ 与 hydration 写成内联 script，
# 支付宝返回的自动提交表单也是内联 script；换 nonce/hash 就得改构建，收益不抵复杂度。
# form-action 必须显式放行 openapi.alipay.com —— 收银台是在 window.open 出来的新页里提交的，
# 该页继承本页 CSP，漏了这行线上支付会静默失败。img-src 放行 https: 是因为封面图来自各家 CDN。

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), usb=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.vidocnote.com https://challenges.cloudflare.com; form-action 'self' https://openapi.alipay.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
